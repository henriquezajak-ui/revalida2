<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080817">
    <meta name="application-name" content="HZ MED">
    <meta name="hz-med-api-contract" content="integrated-codegs-v1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HZ MED">
    <meta name="msapplication-TileColor" content="#080817">
    <!-- HZ MED logotipo oficial (aba do navegador, desktop e tela inicial iPhone/Android) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/hz-med-icon-32.png?v=20261126-logo">
    <link rel="icon" type="image/png" sizes="64x64" href="/hz-med-icon-64.png?v=20261126-logo">
    <link rel="icon" type="image/png" sizes="192x192" href="/hz-med-icon-192.png?v=20261126-logo">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=20261126-logo">
    <link rel="apple-touch-icon" sizes="180x180" href="/hz-med-icon-180.png?v=20261126-logo">
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png?v=20261126-logo">
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png?v=20261126-logo">
    <link rel="manifest" href="/manifest.webmanifest?v=20261126-logo">
    <title>HZ MED — Banco de Questões</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="./styles.bundle.css?v=20261128-sync-fiel">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- PDF.js carregado sob demanda por ensurePdfJsLoaded() ao abrir um PDF -->
    <style>
        html, body, #root {
            width: 100%;
            max-width: 100vw;
            min-width: 0;
            height: 100vh;
            height: -webkit-fill-available;
            height: 100dvh;
            min-height: 0;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
            box-sizing: border-box;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        button, a, [role="button"] {
            touch-action: manipulation;
        }
        .hz-vh-full {
            height: 100vh;
            min-height: 100vh;
            height: -webkit-fill-available;
            min-height: -webkit-fill-available;
            height: 100dvh;
            min-height: 100dvh;
        }
        .hz-modal-h {
            height: 100vh;
            height: -webkit-fill-available;
            height: 100dvh;
        }
        @media (min-width: 640px) {
            .hz-modal-h {
                height: 92vh;
                height: 92dvh;
            }
        }
        .hz-modal-h-pdf {
            height: 100vh;
            height: -webkit-fill-available;
            height: 100dvh;
        }
        @media (min-width: 640px) {
            .hz-modal-h-pdf {
                height: 94vh;
                height: 94dvh;
            }
        }
        @media (max-width: 640px) {
            input[type="text"], input[type="number"], input[type="date"], input[type="search"], input[type="password"], select, textarea {
                font-size: max(16px, 1em);
            }
        }
        @media (pointer: coarse) and (max-width: 1180px) {
            input[type="text"], input[type="number"], input[type="date"], input[type="search"], input[type="password"], select, textarea {
                font-size: max(16px, 1em);
            }
            .hz-touch-noblur,
            .hz-touch-noblur * {
                -webkit-backdrop-filter: none !important;
                backdrop-filter: none !important;
            }
            .hz-heavy-glow {
                display: none !important;
            }
        }
        /* Palco responsivo dedicado ao iframe do Google Drive (celular, iPad 9 e PC) */
        .hz-drive-video-stage {
            position: relative;
            width: 100%;
            height: clamp(310px, 76vw, 48vh);
            max-height: 52vh;
            max-height: 52dvh;
            background: #000;
        }
        .hz-drive-video-stage.hz-drive-video-stage--tall {
            height: clamp(390px, 58vh, 540px);
            max-height: 66vh;
            max-height: 66dvh;
        }
        @media (orientation: landscape) and (max-height: 540px) {
            .hz-drive-video-stage,
            .hz-drive-video-stage.hz-drive-video-stage--tall {
                height: 70vh;
                height: 70dvh;
                min-height: 230px;
                max-height: 82vh;
                max-height: 82dvh;
            }
        }
        @media (min-width: 640px) and (max-width: 1023px) {
            .hz-drive-video-stage {
                height: clamp(360px, 54vw, 56vh);
                max-height: 58vh;
                max-height: 58dvh;
            }
            .hz-drive-video-stage.hz-drive-video-stage--tall {
                height: clamp(440px, 64vw, 68vh);
                max-height: 70vh;
                max-height: 70dvh;
            }
        }
        @media (min-width: 1024px) {
            .hz-drive-video-stage {
                height: clamp(360px, 42vw, 64vh);
                max-height: 66vh;
                max-height: 66dvh;
            }
            .hz-drive-video-stage.hz-drive-video-stage--cinema {
                height: clamp(400px, 50vw, 72vh);
                max-height: 74vh;
                max-height: 74dvh;
            }
        }
        .hz-drive-video-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            min-width: 100%;
            max-width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #000;
        }
        /* Faixa de atualização complementar abaixo do player na Imersão */
        .hz-aula-update-body {
            font-size: 14px;
            line-height: 1.68;
            color: #1f2937;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .hz-aula-update-body > :first-child {
            margin-top: 0 !important;
        }
        .hz-aula-update-body > :last-child {
            margin-bottom: 0 !important;
        }
        .hz-aula-update-body p {
            margin: 0 0 10px 0;
        }
        .hz-aula-update-body h1,
        .hz-aula-update-body h2,
        .hz-aula-update-body h3,
        .hz-aula-update-body h4 {
            font-weight: 800;
            color: #111827;
            margin: 14px 0 6px 0;
            line-height: 1.35;
        }
        .hz-aula-update-body h2 { font-size: 16px; }
        .hz-aula-update-body h3 { font-size: 15px; }
        .hz-aula-update-body strong,
        .hz-aula-update-body b {
            font-weight: 700;
            color: #111827;
        }
        .hz-aula-update-body ul {
            list-style-type: disc;
            padding-left: 1.35rem;
            margin: 6px 0 10px 0;
        }
        .hz-aula-update-body ol {
            list-style-type: decimal;
            padding-left: 1.35rem;
            margin: 6px 0 10px 0;
        }
        .hz-aula-update-body li {
            margin: 3px 0;
        }
        .hz-aula-update-body a {
            color: #1a73e8;
            text-decoration: underline;
            word-break: break-word;
        }
        .hz-aula-update-body a:hover {
            color: #1557b0;
        }
        .hz-aula-update-body img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            margin: 12px auto;
            cursor: zoom-in;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.12);
        }
        .hz-aula-table-wrap {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 12px 0;
            border-radius: 8px;
        }
        .hz-aula-update-body table {
            display: table;
            width: 100%;
            border-collapse: collapse;
            margin: 0;
            font-size: 13px;
            background: #ffffff;
        }
        .hz-aula-update-body th,
        .hz-aula-update-body td {
            border: 1px solid #cbd5e1;
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
            color: #1f2937;
        }
        .hz-aula-update-body th {
            background: #dce8f2;
            font-weight: 700;
            color: #0f172a;
        }
        .hz-aula-update-body blockquote {
            border-left: 4px solid #1a73e8;
            background: rgba(26, 115, 232, 0.08);
            padding: 10px 14px;
            border-radius: 6px;
            margin: 10px 0;
            color: #1f2937;
        }
    </style>
</head>
<body class="bg-[#121212] m-0 p-0 overflow-hidden">
    <div id="root"></div>

    <script src="./app.bundle.js?v=20261128-sync-fiel"></script>
</body>
</html>
